[project]
name = "intelligent-detection-agent"
version = "0.1.0"
description = "燃气计量、设备健康与安全作业智能检测平台"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==0.10.3",
    "fastapi>=0.115,<1",
    "numpy==1.26.4",
    "openai>=2,<3",
    "opencv-python>=4.10,<5",
    "openpyxl==3.1.5",
    "pandas==2.2.2",
    "pillow>=10,<13",
    "pypdf>=6,<7",
    "pyarrow==17.0.0",
    "pyyaml>=6,<7",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.18,<2",
    "scikit-learn==1.5.1",
    "torch==2.4.1",
    "ultralytics>=8.4.116",
    "uvicorn==0.30.6",
    "lap>=0.5.13",
    "deepagents>=0.7.5",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.4.2",
    "sqlglot>=30.15.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "httpx>=0.28,<1",
]

[project.scripts]
intelligent-detection-api = "intelligent_detection_agent.__main__:main"

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"intelligent_detection_agent.rag" = ["eval_cases.json"]
"intelligent_detection_agent.conversation_agent" = ["skills/**/*.md"]
"intelligent_detection_agent.evaluation" = ["agent_eval_cases.json"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
