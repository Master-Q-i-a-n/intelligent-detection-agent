[project]
name = "intelligent-detection-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==0.10.3",
    "fastapi>=0.115,<1",
    "numpy==1.26.4",
    "openai>=2,<3",
    "opencv-python>=4.10,<5",
    "openpyxl==3.1.5",
    "pandas==2.2.2",
    "pillow>=10,<13",
    "pyarrow==17.0.0",
    "pyyaml>=6,<7",
    "pydantic>=2.10,<3",
    "scikit-learn==1.5.1",
    "torch==2.4.1",
    "ultralytics>=8.4.116",
    "uvicorn==0.30.6",
    "lap>=0.5.13",
    "deepagents>=0.7.5",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.4.2",
    "sqlglot>=30.15.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# runtime_libs 是历史依赖副本，不应收集其中第三方包自带的测试。
testpaths = ["tests", "conversation_agent/tests", "safety_operations/tests"]
pythonpath = ["."]
